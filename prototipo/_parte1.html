<title>LetícIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">

<style>
/* =========================================================================
   LetícIA - protótipo de tela (Fase 1)
   Descartável, menos três coisas: o texto das perguntas, os tokens e as
   medidas do movimento.

   Toda regra começa com .leticia-raiz. A única exceção está marcada logo
   abaixo e não vai para o plugin.
   ========================================================================= */

/* fora do plugin: só o protótipo precisa pintar o fundo da página hospedeira */
body { background: #FBFBFC; }

/* ---- tokens ------------------------------------------------------------ */
.leticia-raiz {
  --lt-fundo:        #FBFBFC;
  --lt-superficie:   #FFFFFF;
  --lt-borda:        #E7E8EC;
  --lt-borda-forte:  #D6D8DE;
  --lt-texto:        #16181D;
  --lt-texto-suave:  #6B7280;
  --lt-acento:       #1F5EFF;
  --lt-acento-fraco: rgba(31, 94, 255, .08);
  --lt-sucesso:      #0E9F6E;
  --lt-atencao:      #B45309;
  --lt-atencao-fraco: rgba(180, 83, 9, .07);

  --lt-e1: 4px;  --lt-e2: 8px;  --lt-e3: 12px; --lt-e4: 16px;
  --lt-e5: 24px; --lt-e6: 32px; --lt-e7: 48px; --lt-e8: 64px;

  --lt-raio-campo: 10px;
  --lt-raio-botao: 8px;

  --lt-sombra: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);

  --lt-micro: 120ms; --lt-padrao: 220ms; --lt-entrada: 320ms; --lt-progresso: 420ms;
  --lt-desacelera: cubic-bezier(.2,0,0,1);
  --lt-acelera:    cubic-bezier(.4,0,1,1);
  --lt-entre:      cubic-bezier(.4,0,.2,1);

  --lt-coluna: 640px;

  color-scheme: light;
  font-family: Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  color: var(--lt-texto);
  background: var(--lt-fundo);
  -webkit-font-smoothing: antialiased;

  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
}

/* ---- reset de território ------------------------------------------------ */
.leticia-raiz *,
.leticia-raiz *::before,
.leticia-raiz *::after { box-sizing: border-box; }

.leticia-raiz button,
.leticia-raiz input,
.leticia-raiz textarea,
.leticia-raiz select {
  font: inherit; color: inherit; letter-spacing: inherit;
  margin: 0; padding: 0;
  border: 0; border-radius: 0;
  background: none; box-shadow: none;
  text-transform: none; text-align: left;
  line-height: inherit; min-height: 0; width: auto;
  -webkit-appearance: none; appearance: none;
}
.leticia-raiz button { cursor: pointer; }
.leticia-raiz button[disabled] { cursor: default; }
.leticia-raiz label { display: inline; margin: 0; font-weight: inherit; font-size: inherit; color: inherit; }
.leticia-raiz p { margin: 0; padding: 0; font-size: inherit; line-height: inherit; }
.leticia-raiz ul, .leticia-raiz ol, .leticia-raiz li { margin: 0; padding: 0; list-style: none; }
.leticia-raiz h1, .leticia-raiz h2 { margin: 0; font-size: inherit; font-weight: 500; line-height: inherit; }
.leticia-raiz svg { display: block; }
.leticia-raiz [hidden] { display: none !important; }

.leticia-raiz :focus { outline: none; }
.leticia-raiz :focus-visible {
  outline: 2px solid var(--lt-acento);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ---- cabeçalho e progresso ---------------------------------------------- */
.leticia-raiz .lt-topo {
  position: sticky; top: 0; z-index: 20;
  background: rgba(251,251,252,.93);
  border-bottom: 1px solid var(--lt-borda);
  padding: var(--lt-e3) var(--lt-e5) 0;
  padding-top: max(var(--lt-e3), env(safe-area-inset-top));
}
@supports (backdrop-filter: blur(6px)) {
  .leticia-raiz .lt-topo { backdrop-filter: saturate(1.2) blur(6px); }
}
.leticia-raiz .lt-topo-interno {
  width: 100%; max-width: var(--lt-coluna); margin: 0 auto;
  padding-bottom: var(--lt-e3);
}
.leticia-raiz .lt-topo-linha {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--lt-e3); margin-bottom: var(--lt-e2);
}
.leticia-raiz .lt-marca { font-size: 13px; font-weight: 600; letter-spacing: .01em; }
.leticia-raiz .lt-marca span { font-weight: 400; color: var(--lt-texto-suave); }
.leticia-raiz .lt-contagem { font-size: 13px; color: var(--lt-texto-suave); font-variant-numeric: tabular-nums; }

.leticia-raiz .lt-barra { display: flex; gap: var(--lt-e1); }
.leticia-raiz .lt-segmento {
  height: 4px; border-radius: 999px; background: var(--lt-borda);
  overflow: hidden;
  transition: background var(--lt-entrada) var(--lt-entre);
}
.leticia-raiz .lt-segmento--feito { background: var(--lt-borda-forte); }
.leticia-raiz .lt-segmento i {
  display: block; height: 100%; width: 0%;
  background: var(--lt-acento); border-radius: 999px;
  transition: width var(--lt-progresso) var(--lt-entre);
}

/* ---- corpo --------------------------------------------------------------- */
.leticia-raiz .lt-corpo {
  flex: 1 1 auto;
  padding: var(--lt-e5) var(--lt-e5) var(--lt-e4);
  display: flex; flex-direction: column;
}
.leticia-raiz .lt-coluna {
  width: 100%; max-width: var(--lt-coluna); margin: 0 auto;
  flex: 1 1 auto; display: flex; flex-direction: column;
}

/* ---- histórico ----------------------------------------------------------- */
.leticia-raiz .lt-historico { display: flex; flex-direction: column; margin-bottom: var(--lt-e5); }
.leticia-raiz .lt-historico:empty { margin-bottom: 0; }
.leticia-raiz .lt-passado {
  display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: baseline;
  gap: var(--lt-e3); width: 100%;
  padding: 7px 0;
  font-size: 13px; color: var(--lt-texto-suave);
  opacity: .6;
  border-bottom: 1px solid transparent;
  transition: opacity var(--lt-micro) var(--lt-entre), border-color var(--lt-micro) var(--lt-entre);
}
.leticia-raiz .lt-passado:hover,
.leticia-raiz .lt-passado:focus-visible { opacity: 1; border-bottom-color: var(--lt-borda); }
.leticia-raiz .lt-passado-texto { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.leticia-raiz .lt-passado-texto b { font-weight: 500; color: var(--lt-texto); }
.leticia-raiz .lt-passado-acao { font-size: 13px; color: var(--lt-acento); white-space: nowrap; opacity: 0; transition: opacity var(--lt-micro) var(--lt-entre); }
.leticia-raiz .lt-passado:hover .lt-passado-acao,
.leticia-raiz .lt-passado:focus-visible .lt-passado-acao { opacity: 1; }
.leticia-raiz .lt-passado--aberto { opacity: 1; }
.leticia-raiz .lt-passado--aberto .lt-passado-texto { white-space: normal; }

/* ---- turno atual --------------------------------------------------------- */
.leticia-raiz .lt-turno { display: flex; flex-direction: column; gap: var(--lt-e4); }
.leticia-raiz .lt-secao-aviso {
  font-size: 15px; color: var(--lt-texto-suave);
  border-left: 2px solid var(--lt-borda-forte);
  padding-left: var(--lt-e3); max-width: 62ch;
}
.leticia-raiz .lt-pergunta {
  font-size: 22px; line-height: 1.35; font-weight: 500; letter-spacing: -.01em;
  max-width: 62ch; text-wrap: balance;
}
.leticia-raiz .lt-fala { font-size: 17px; line-height: 1.55; max-width: 62ch; }
.leticia-raiz .lt-fala--suave { color: var(--lt-texto-suave); }
.leticia-raiz .lt-balao {
  align-self: flex-end;
  max-width: min(86%, 52ch);
  background: var(--lt-acento-fraco);
  border-radius: var(--lt-raio-campo);
  padding: var(--lt-e3) var(--lt-e4);
  font-size: 17px; line-height: 1.5;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.leticia-raiz .lt-ajuda { font-size: 13px; line-height: 1.4; color: var(--lt-texto-suave); max-width: 62ch; }

/* ---- pontinhos ----------------------------------------------------------- */
.leticia-raiz .lt-pensando { display: flex; align-items: center; gap: 5px; height: 24px; }
.leticia-raiz .lt-pensando i {
  width: 5px; height: 5px; border-radius: 999px; background: var(--lt-texto-suave);
  opacity: .3; animation: lt-pulsa 1.4s infinite var(--lt-entre);
}
.leticia-raiz .lt-pensando i:nth-child(2) { animation-delay: 160ms; }
.leticia-raiz .lt-pensando i:nth-child(3) { animation-delay: 320ms; }
.leticia-raiz .lt-pensando-rotulo { display: none; font-size: 13px; color: var(--lt-texto-suave); }
@keyframes lt-pulsa { 0%,100% { opacity: .3 } 50% { opacity: 1 } }

/* ---- área de resposta ---------------------------------------------------- */
.leticia-raiz .lt-resposta { margin-top: var(--lt-e5); display: flex; flex-direction: column; gap: var(--lt-e2); }
.leticia-raiz .lt-campo {
  display: flex; align-items: flex-end; gap: var(--lt-e2);
  background: var(--lt-superficie);
  border: 1px solid var(--lt-borda);
  border-radius: var(--lt-raio-campo);
  padding: var(--lt-e2) var(--lt-e2) var(--lt-e2) var(--lt-e3);
  transition: border-color var(--lt-micro) var(--lt-entre), box-shadow var(--lt-micro) var(--lt-entre);
}
.leticia-raiz .lt-campo:focus-within { border-color: var(--lt-borda-forte); box-shadow: var(--lt-sombra); }
.leticia-raiz .lt-campo--erro { border-color: var(--lt-atencao); }
.leticia-raiz .lt-campo textarea {
  flex: 1 1 auto; min-width: 0;
  font-size: 16px; line-height: 1.5;
  resize: none; overflow-y: auto;
  max-height: 9em; padding: 8px 0;
}
.leticia-raiz .lt-campo textarea::placeholder { color: var(--lt-texto-suave); opacity: .85; }
.leticia-raiz .lt-enviar {
  flex: 0 0 auto;
  width: 44px; height: 44px; border-radius: var(--lt-raio-botao);
  background: var(--lt-acento); color: #fff;
  display: grid; place-items: center;
  transition: background var(--lt-micro) var(--lt-entre);
}
.leticia-raiz .lt-enviar[disabled] { background: var(--lt-borda); color: var(--lt-texto-suave); }
.leticia-raiz .lt-linha-abaixo {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--lt-e3); min-height: 24px;
}
.leticia-raiz .lt-acoes { display: flex; align-items: center; gap: var(--lt-e1); flex-wrap: wrap; }
.leticia-raiz .lt-dica { font-size: 13px; color: var(--lt-texto-suave); }
.leticia-raiz .lt-contador { font-size: 13px; color: var(--lt-texto-suave); font-variant-numeric: tabular-nums; }
.leticia-raiz .lt-erro { font-size: 13px; line-height: 1.4; color: var(--lt-atencao); max-width: 62ch; }

/* ---- botões -------------------------------------------------------------- */
.leticia-raiz .lt-btn {
  display: inline-flex; align-items: center; gap: var(--lt-e2);
  min-height: 44px; padding: 0 var(--lt-e3);
  border-radius: var(--lt-raio-botao);
  font-size: 15px; color: var(--lt-texto-suave);
  transition: color var(--lt-micro) var(--lt-entre), background var(--lt-micro) var(--lt-entre);
}
.leticia-raiz .lt-btn:hover { color: var(--lt-texto); background: rgba(22,24,29,.04); }
.leticia-raiz .lt-btn[disabled] { opacity: .4; }
.leticia-raiz .lt-btn[disabled]:hover { color: var(--lt-texto-suave); background: none; }

.leticia-raiz .lt-btn-primario {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--lt-e2);
  min-height: 48px; padding: 0 var(--lt-e5);
  border-radius: var(--lt-raio-botao);
  background: var(--lt-acento); color: #fff; font-weight: 500; font-size: 17px;
  transition: background var(--lt-micro) var(--lt-entre);
}
.leticia-raiz .lt-btn-primario[disabled] { background: var(--lt-borda); color: var(--lt-texto-suave); }

.leticia-raiz .lt-escolhas { display: flex; flex-wrap: wrap; gap: var(--lt-e2); }
.leticia-raiz .lt-escolha {
  min-height: 44px; padding: 0 var(--lt-e4);
  border: 1px solid var(--lt-borda);
  background: var(--lt-superficie);
  border-radius: var(--lt-raio-botao);
  font-size: 15px;
  transition: border-color var(--lt-micro) var(--lt-entre), background var(--lt-micro) var(--lt-entre);
}
.leticia-raiz .lt-escolha:hover { border-color: var(--lt-borda-forte); }
.leticia-raiz .lt-escolha--marcada { border-color: var(--lt-acento); background: var(--lt-acento-fraco); }

/* ---- conferido ----------------------------------------------------------- */
.leticia-raiz .lt-conferido { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--lt-sucesso); }
.leticia-raiz .lt-conferido svg path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: lt-risca 260ms var(--lt-desacelera) forwards; }
@keyframes lt-risca { to { stroke-dashoffset: 0 } }

/* ---- upload -------------------------------------------------------------- */
.leticia-raiz .lt-solta {
  border: 1px dashed var(--lt-borda-forte); border-radius: var(--lt-raio-campo);
  background: var(--lt-superficie);
  padding: var(--lt-e5); text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: var(--lt-e2);
  transition: border-color var(--lt-micro) var(--lt-entre), background var(--lt-micro) var(--lt-entre);
}
.leticia-raiz .lt-solta--arrastando { border-color: var(--lt-acento); background: var(--lt-acento-fraco); }
.leticia-raiz .lt-solta-titulo { font-size: 15px; font-weight: 500; }
.leticia-raiz .lt-solta-sub { font-size: 13px; color: var(--lt-texto-suave); max-width: 46ch; }
.leticia-raiz .lt-arquivos { display: flex; flex-direction: column; gap: var(--lt-e2); }
.leticia-raiz .lt-arquivos:empty { display: none; }
.leticia-raiz .lt-arquivo {
  display: grid; grid-template-columns: 40px minmax(0,1fr) 44px; align-items: center;
  gap: var(--lt-e3);
  background: var(--lt-superficie); border: 1px solid var(--lt-borda);
  border-radius: var(--lt-raio-campo); padding: var(--lt-e3);
  box-shadow: var(--lt-sombra);
}
.leticia-raiz .lt-arquivo--ruim { border-color: var(--lt-atencao); }
.leticia-raiz .lt-arquivo-mini {
  width: 40px; height: 40px; border-radius: 6px; background: var(--lt-fundo);
  display: grid; place-items: center; overflow: hidden; color: var(--lt-texto-suave);
}
.leticia-raiz .lt-arquivo-mini img { width: 100%; height: 100%; object-fit: cover; }
.leticia-raiz .lt-arquivo-nome { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leticia-raiz .lt-arquivo-sub { font-size: 13px; color: var(--lt-texto-suave); font-variant-numeric: tabular-nums; }
.leticia-raiz .lt-arquivo-sub--ruim { color: var(--lt-atencao); }
.leticia-raiz .lt-arquivo-barra { height: 3px; border-radius: 999px; background: var(--lt-borda); overflow: hidden; margin-top: 6px; }
.leticia-raiz .lt-arquivo-barra i { display: block; height: 100%; width: 0; background: var(--lt-acento); transition: width 90ms linear; }
.leticia-raiz .lt-remover { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--lt-raio-botao); color: var(--lt-texto-suave); }
.leticia-raiz .lt-remover:hover { color: var(--lt-texto); background: rgba(22,24,29,.04); }

/* ---- revisão ------------------------------------------------------------- */
.leticia-raiz .lt-revisao { display: flex; flex-direction: column; gap: var(--lt-e5); }
.leticia-raiz .lt-titulo { font-size: 30px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; text-wrap: balance; }
.leticia-raiz .lt-lista { border-top: 1px solid var(--lt-borda); }
.leticia-raiz .lt-item {
  display: grid; grid-template-columns: 172px minmax(0,1fr) auto; gap: var(--lt-e4);
  align-items: baseline;
  padding: var(--lt-e3) 0; border-bottom: 1px solid var(--lt-borda);
}
.leticia-raiz .lt-item-rotulo { font-size: 13px; color: var(--lt-texto-suave); }
.leticia-raiz .lt-item-valor { font-size: 15px; overflow-wrap: anywhere; white-space: pre-wrap; }
.leticia-raiz .lt-item-valor--vazio { color: var(--lt-texto-suave); }
.leticia-raiz .lt-editar { font-size: 13px; color: var(--lt-acento); min-height: 44px; padding: 0 var(--lt-e2); border-radius: var(--lt-raio-botao); }
.leticia-raiz .lt-editar:hover { background: var(--lt-acento-fraco); }

.leticia-raiz .lt-aceite {
  display: flex; gap: var(--lt-e3); align-items: flex-start;
  background: var(--lt-superficie); border: 1px solid var(--lt-borda);
  border-radius: var(--lt-raio-campo); padding: var(--lt-e4);
}
.leticia-raiz .lt-aceite input {
  flex: 0 0 auto; width: 20px; height: 20px; margin-top: 2px;
  border: 1px solid var(--lt-borda-forte); border-radius: 5px; background: var(--lt-superficie);
  display: grid; place-items: center; cursor: pointer;
}
.leticia-raiz .lt-aceite input:checked { background: var(--lt-acento); border-color: var(--lt-acento); }
.leticia-raiz .lt-aceite input:checked::after {
  content: ""; width: 10px; height: 6px;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translate(1px,-2px);
}
.leticia-raiz .lt-aceite label { font-size: 15px; line-height: 1.5; cursor: pointer; display: block; }

.leticia-raiz .lt-pendencia {
  display: grid; grid-template-columns: 18px minmax(0,1fr); gap: var(--lt-e3); align-items: start;
  border: 1px solid var(--lt-borda); border-left: 3px solid var(--lt-atencao);
  background: var(--lt-atencao-fraco);
  border-radius: var(--lt-raio-campo); padding: var(--lt-e3) var(--lt-e4);
  font-size: 15px; line-height: 1.5;
}
.leticia-raiz .lt-pendencia svg { margin-top: 3px; color: var(--lt-atencao); }

/* ---- fim ----------------------------------------------------------------- */
.leticia-raiz .lt-final { display: flex; flex-direction: column; gap: var(--lt-e4); max-width: 62ch; padding-top: var(--lt-e6); }
.leticia-raiz .lt-selo { width: 44px; height: 44px; color: var(--lt-sucesso); }
.leticia-raiz .lt-selo circle { stroke-dasharray: 126; stroke-dashoffset: 126; animation: lt-desenha 400ms var(--lt-desacelera) forwards; }
.leticia-raiz .lt-selo path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: lt-desenha 260ms var(--lt-desacelera) 200ms forwards; }
@keyframes lt-desenha { to { stroke-dashoffset: 0 } }
.leticia-raiz .lt-proximos { display: flex; flex-direction: column; gap: var(--lt-e2); }
.leticia-raiz .lt-proximo { display: grid; grid-template-columns: 14px minmax(0,1fr); gap: var(--lt-e3); align-items: start; font-size: 15px; line-height: 1.5; }
.leticia-raiz .lt-proximo i { width: 6px; height: 6px; border-radius: 999px; background: var(--lt-borda-forte); margin: 9px 0 0 4px; }
.leticia-raiz .lt-saida { font-size: 15px; color: var(--lt-texto-suave); }
.leticia-raiz .lt-saida a { color: var(--lt-acento); }

/* ---- retomada ------------------------------------------------------------ */
.leticia-raiz .lt-retomada {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--lt-e2) var(--lt-e3);
  background: var(--lt-superficie); border: 1px solid var(--lt-borda);
  border-radius: var(--lt-raio-campo); padding: var(--lt-e3) var(--lt-e4);
  margin-bottom: var(--lt-e5); font-size: 15px;
}
.leticia-raiz .lt-retomada p { flex: 1 1 260px; min-width: 0; }
.leticia-raiz .lt-retomada button { font-size: 15px; color: var(--lt-acento); min-height: 44px; padding: 0 var(--lt-e2); border-radius: var(--lt-raio-botao); }
.leticia-raiz .lt-retomada button:hover { background: var(--lt-acento-fraco); }

/* ---- movimento ----------------------------------------------------------- */
.leticia-raiz .lt-entra { animation: lt-entra var(--lt-entrada) var(--lt-desacelera) both; }
@keyframes lt-entra { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

.leticia-raiz .lt-entra-curto { animation: lt-entra-curto var(--lt-padrao) var(--lt-desacelera) both; }
@keyframes lt-entra-curto { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }

.leticia-raiz .lt-sobe { animation: lt-sobe 200ms var(--lt-entre) both; }
@keyframes lt-sobe { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

.leticia-raiz .lt-treme { animation: lt-treme 180ms var(--lt-entre) 2; }
@keyframes lt-treme { 0%,100% { transform: none } 25% { transform: translateX(-3px) } 75% { transform: translateX(3px) } }

.leticia-raiz .lt-invisivel {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}

/* ---- painel do protótipo (não vai para o plugin) ------------------------- */
.leticia-raiz .lt-oficina {
  position: fixed; left: 12px; bottom: 12px; z-index: 40;
  display: flex; flex-direction: column; gap: 6px;
  background: var(--lt-superficie); border: 1px solid var(--lt-borda);
